<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Alemão - Vocabulário Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <div class="max-w-3xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🇩🇪 Flashcards Alemão
            </h1>
            <div id="stats" class="text-sm bg-indigo-700 px-3 py-1 rounded-full font-medium">
                Progresso: 0 / 0 | Acertos: 0
            </div>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto p-4 sm:p-6 flex-grow flex flex-col justify-center">
        
        <!-- Flashcard container with flip effect -->
        <div class="perspective-1000 w-full h-72 sm:h-80 mb-6 cursor-pointer" id="cardContainer" onclick="flipCard()">
            <div id="cardInner" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-2xl bg-white border border-slate-100">
                
                <!-- Front Side (Deutsch) -->
                <div class="absolute inset-0 w-full h-full backface-hidden flex flex-col justify-between p-6 sm:p-8 bg-gradient-to-br from-white to-slate-50 rounded-2xl">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase bg-indigo-50 px-2.5 py-1 rounded-full">Anverso (Alemão)</span>
                        <button onclick="event.stopPropagation(); speakGerman();" class="p-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-full transition-all shadow-sm" title="Ouvir pronúncia">
                            🔊
                        </button>
                    </div>
                    <div class="text-center my-auto">
                        <h2 id="cardGerman" class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Carregando...</h2>
                        <p class="text-xs text-slate-400 mt-2 italic" id="cardHint">Clique para virar o cartão</p>
                    </div>
                    <div class="text-center text-xs text-slate-400">Cartão <span id="currentIndexDisplay">1</span> de <span id="totalCardsDisplay">0</span></div>
                </div>

                <!-- Back Side (Português) -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 flex flex-col justify-between p-6 sm:p-8 bg-gradient-to-br from-indigo-50 to-white rounded-2xl">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold tracking-wider text-emerald-600 uppercase bg-emerald-50 px-2.5 py-1 rounded-full">Verso (Português)</span>
                        <span class="text-xs text-slate-400">Tradução</span>
                    </div>
                    <div class="text-center my-auto">
                        <h2 id="cardPortuguese" class="text-3xl sm:text-4xl font-extrabold text-emerald-700 tracking-tight">Tradução</h2>
                    </div>
                    <div class="text-center text-xs text-slate-400">Verso do Cartão</div>
                </div>

            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <h3 class="text-sm font-semibold text-slate-700 mb-3">Teste seu conhecimento:</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Digite a palavra em Alemão:</label>
                    <input type="text" id="inputGerman" placeholder="Ex: Nachricht" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Digite a tradução em Português:</label>
                    <input type="text" id="inputPortuguese" placeholder="Ex: Mensagem" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>
                <button onclick="verifyAnswer()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm text-sm">
                    Verificar Resposta
                </button>
            </div>
            <div id="feedbackMessage" class="mt-3 text-center text-sm font-medium hidden"></div>
        </div>

        <div class="flex items-center justify-between gap-3">
            <button onclick="prevCard()" class="flex-1 bg-white hover:bg-slate-100 text-slate-700 font-medium py-2.5 px-4 rounded-xl border border-slate-300 shadow-sm transition-colors text-sm">
                ← Anterior
            </button>
            <button onclick="resetCards()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 px-4 rounded-xl transition-colors text-sm" title="Reiniciar">
                🔄
            </button>
            <button onclick="nextCard()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm transition-colors text-sm">
                Próximo →
            </button>
        </div>

    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white">
        Desenvolvido para estudo prático e interativo de vocabulário alemão.
    </footer>

    <script>
        // Conjunto abrangente de palavras extraídas das lições sem repetição
        const flashcardsData = [
            { german: "folgen", portuguese: "seguir" },
            { german: "buchstabieren", portuguese: "soletrar" },
            { german: "abends", portuguese: "à noite" },
            { german: "morgens", portuguese: "de manhã" },
            { german: "warten", portuguese: "esperar" },
            { german: "Welt", portuguese: "mundo" },
            { german: "Museum", portuguese: "museu" },
            { german: "Gemälde", portuguese: "pintura / quadro" },
            { german: "berühmt", portuguese: "famoso" },
            { german: "Foto", portuguese: "foto" },
            { german: "Handy", portuguese: "celular" },
            { german: "Geheimnis", portuguese: "segredo" },
            { german: "unglaublich", portuguese: "inacreditável" },
            { german: "lächeln", portuguese: "sorrir" },
            { german: "Licht", portuguese: "luz" },
            { german: "schlecht", portuguese: "ruim" },
            { german: "zufrieden", portuguese: "satisfeito" },
            { german: "Mühe", portuguese: "esforço / trabalho" },
            { german: "Nachricht", portuguese: "mensagem" },
            { german: "Chef", portuguese: "chefe" },
            { german: "Tippfehler", portuguese: "erro de digitação" },
            { german: "Internet", portuguese: "internet" },
            { german: "WLAN", portuguese: "Wi-Fi" },
            { german: "Kellner", portuguese: "garçom" },
            { german: "Passwort", portuguese: "senha" },
            { german: "Projekte", portuguese: "projetos" },
            { german: "Team", portuguese: "equipe / time" },
            { german: "schreiben", portuguese: "escrever" },
            { german: "entspannen", portuguese: "relaxar" },
            { german: "schicken", portuguese: "enviar" },
            { german: "verbinden", portuguese: "conectar" },
            { german: "antworten", portuguese: "responder" },
            { german: "funktionieren", portuguese: "funcionar" },
            { german: "glauben", portuguese: "acreditar / achar" },
            { german: "wichtig", portuguese: "importante" },
            { german: "professionell", portuguese: "profissional" },
            { german: "lustig", portuguese: "engraçado" },
            { german: "sofort", portuguese: "imediatamente" },
            { german: "offline", portuguese: "offline / desconectado" }
        ];

        let currentIndex = 0;
        let correctCount = 0;
        let isFlipped = false;

        const cardContainer = document.getElementById('cardContainer');
        const cardInner = document.getElementById('cardInner');
        const cardGerman = document.getElementById('cardGerman');
        const cardPortuguese = document.getElementById('cardPortuguese');
        const currentIndexDisplay = document.getElementById('currentIndexDisplay');
        const totalCardsDisplay = document.getElementById('totalCardsDisplay');
        const stats = document.getElementById('stats');
        const inputGerman = document.getElementById('inputGerman');
        const inputPortuguese = document.getElementById('inputPortuguese');
        const feedbackMessage = document.getElementById('feedbackMessage');

        function initApp() {
            totalCardsDisplay.textContent = flashcardsData.length;
            loadCard();
        }

        function loadCard() {
            const currentCard = flashcardsData[currentIndex];
            cardGerman.textContent = currentCard.german;
            cardPortuguese.textContent = currentCard.portuguese;
            currentIndexDisplay.textContent = currentIndex + 1;
            
            if (isFlipped) {
                cardInner.classList.remove('rotate-y-180');
                isFlipped = false;
            }

            inputGerman.value = '';
            inputPortuguese.value = '';
            feedbackMessage.classList.add('hidden');
            updateStats();
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
            } else {
                cardInner.classList.remove('rotate-y-180');
            }
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % flashcardsData.length;
            loadCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + flashcardsData.length) % flashcardsData.length;
            loadCard();
        }

        function resetCards() {
            currentIndex = 0;
            correctCount = 0;
            loadCard();
        }

        function updateStats() {
            stats.textContent = `Progresso: ${currentIndex + 1} / ${flashcardsData.length} | Acertos: ${correctCount}`;
        }

        function speakGerman() {
            const text = flashcardsData[currentIndex].german;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                showFeedback("Síntese de voz não suportada neste navegador.", false);
            }
        }

        function verifyAnswer() {
            const currentCard = flashcardsData[currentIndex];
            const userGerman = inputGerman.value.trim().toLowerCase();
            const userPortuguese = inputPortuguese.value.trim().toLowerCase();

            const correctGerman = currentCard.german.toLowerCase();
            const correctPortuguese = currentCard.portuguese.toLowerCase();

            // Valida se pelo menos um está correto ou ambos
            const isGermanCorrect = userGerman === correctGerman;
            const isPortugueseCorrect = userPortuguese === correctPortuguese;

            if (isGermanCorrect || isPortugueseCorrect) {
                correctCount++;
                showFeedback("Correto! Bom trabalho 🎉", true);
                if (!isFlipped) flipCard();
            } else {
                showFeedback(`Incorreto. O correto era: ${currentCard.german} - ${currentCard.portuguese}`, false);
                if (!isFlipped) flipCard();
            }
            updateStats();
        }

        function showFeedback(text, isSuccess) {
            feedbackMessage.textContent = text;
            feedbackMessage.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
            feedbackMessage.classList.add(isSuccess ? 'text-emerald-600' : 'text-rose-600');
        }

        window.onload = initApp;
    </script>
</body>
</html>
